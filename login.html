<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DriveFree</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%232565eb' width='100' height='100' rx='20'/><path fill='white' d='M20 55 L25 45 L35 45 L40 55 L20 55 M60 55 L65 45 L75 45 L80 55 L60 55 M30 55 L70 55 L70 65 L30 65 L30 55 M25 65 L75 65 L75 70 L25 70 L25 65 M35 40 L65 40 L65 45 L35 45 L35 40'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color, #f8fafc);
            padding: 2rem;
        }

        .login-right {
            background: transparent;
            padding: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            background: var(--surface-color, #ffffff);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color, #e2e8f0);
            max-width: 420px;
            width: 100%;
        }

        .login-card-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color, #3b82f6);
            margin-bottom: 1.5rem;
        }
        .login-card-logo i {
            color: var(--primary-color, #3b82f6);
        }

        /* Controls (theme + RTL) */
        .login-controls {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            z-index: 10;
        }
        .btn-icon {
            background: var(--bg-color, #f1f5f9);
            border: 1.5px solid var(--border-color, #e2e8f0);
            font-size: 1rem;
            color: var(--text-color, #0f172a);
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
        }
        .btn-icon:hover { color: #3b82f6; border-color: #3b82f6; }

        /* RTL Pill (matches global style.css) */
        .rtl-pill {
            display: inline-flex;
            align-items: center;
            background: var(--bg-color, #f1f5f9);
            border: 1.5px solid var(--border-color, #e2e8f0);
            border-radius: 999px;
            padding: 3px 3px 3px 10px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-color, #0f172a);
            white-space: nowrap;
            user-select: none;
            height: 34px;
            transition: all 0.25s;
        }
        .rtl-pill:hover { border-color: #3b82f6; color: #3b82f6; }
        .rtl-pill .pill-label { min-width: 22px; text-align: center; }
        .rtl-pill .pill-circle {
            width: 26px; height: 26px;
            border-radius: 50%;
            background: #3b82f6;
            color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: 800;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .login-box h1 {
            font-size: 1.9rem;
            font-weight: 800;
            color: var(--text-color, #0f172a);
            margin-bottom: 0.4rem;
            text-align: center;
            white-space: nowrap;
        }
        .login-box .login-subtitle {
            color: var(--text-muted, #64748b);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            text-align: center;
            white-space: nowrap;
        }

        /* Role tabs */
        .role-tabs {
            display: flex;
            gap: 0;
            background: var(--surface-color, #f1f5f9);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 1.75rem;
            border: 1px solid var(--border-color, #e2e8f0);
        }
        .role-tab {
            flex: 1;
            padding: 0.6rem;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-muted, #64748b);
            transition: all 0.25s;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
        .role-tab.active {
            background: var(--primary-color, #3b82f6);
            color: white;
            box-shadow: 0 2px 8px rgba(59,130,246,0.35);
        }

        /* Form */
        .login-form { display: flex; flex-direction: column; gap: 1.1rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-color, #0f172a);
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted, #94a3b8);
            font-size: 0.9rem;
            z-index: 2;
        }
        .input-wrap input {
            width: 100%;
            padding: 0.8rem 3.5rem 0.8rem 2.7rem;
            border: 1.5px solid var(--border-color, #e2e8f0);
            border-radius: 8px;
            background: var(--surface-color, #ffffff);
            color: var(--text-color, #0f172a);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .input-wrap input:focus {
            border-color: var(--primary-color, #3b82f6);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        .toggle-pw {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted, #94a3b8);
            font-size: 0.9rem;
            padding: 0;
            z-index: 2;
        }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            color: var(--text-muted, #64748b);
            cursor: pointer;
        }
        .remember-me input { accent-color: var(--primary-color, #3b82f6); cursor: pointer; }
        .forgot-link {
            color: var(--primary-color, #3b82f6);
            text-decoration: none;
            font-weight: 600;
        }
        .forgot-link:hover { text-decoration: underline; }

        .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: var(--primary-color, #3b82f6);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.25s, transform 0.2s, box-shadow 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-family: inherit;
        }
        .btn-login:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(59,130,246,0.4);
        }

        .login-divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-muted, #94a3b8);
            font-size: 0.82rem;
            margin: 0.25rem 0;
        }
        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color, #e2e8f0);
        }

        .social-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }
        .btn-social {
            padding: 0.7rem;
            border: 1.5px solid var(--border-color, #e2e8f0);
            border-radius: 8px;
            background: var(--surface-color, #ffffff);
            color: var(--text-color, #0f172a);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: border-color 0.25s, box-shadow 0.25s;
            font-family: inherit;
        }
        .btn-social:hover { border-color: var(--primary-color, #3b82f6); box-shadow: 0 2px 8px rgba(59,130,246,0.12); }
        .btn-social .fa-facebook-f { color: #1877f2; }

        .signup-link {
            text-align: center;
            font-size: 0.88rem;
            color: var(--text-muted, #64748b);
            margin-top: 0.5rem;
        }
        .signup-link a {
            color: var(--primary-color, #3b82f6);
            font-weight: 600;
            text-decoration: none;
        }
        .signup-link a:hover { text-decoration: underline; }

        .login-error {
            display: none;
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.3);
            color: #ef4444;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            font-size: 0.88rem;
            align-items: center;
            gap: 0.5rem;
        }
        .login-error.show { display: flex; }

        /* Responsive */
        @media (max-width: 768px) {
            .login-page { padding: 1.5rem; }
            .login-box { padding: 2rem; }
            .login-box h1 { font-size: 1.6rem; }
            .role-tabs { margin-bottom: 1.5rem; }
            .role-tab { font-size: 0.85rem; padding: 0.55rem; }
        }

        @media (max-width: 480px) {
            .login-page { padding: 1rem; }
            .login-box { padding: 1.5rem; }
            .login-box h1 { font-size: 1.4rem; }
            .login-box .login-subtitle { font-size: 0.9rem; }
            .form-group label { font-size: 0.8rem; }
            .input-wrap input { padding: 0.75rem 3rem 0.75rem 2.5rem; font-size: 0.9rem; }
            .form-options { font-size: 0.8rem; flex-direction: column; gap: 0.5rem; align-items: flex-start; }
            .btn-login { padding: 0.75rem; font-size: 0.95rem; }
            .social-login { gap: 0.6rem; }
            .btn-social { padding: 0.65rem; font-size: 0.85rem; }
            .signup-link { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

<div class="login-page">
    <!-- LOGIN CARD -->
    <div class="login-right">
        <div class="login-controls">
            <button class="btn-icon" id="theme-toggle" title="Toggle Dark/Light Mode"><i class="fas fa-moon"></i></button>
            <button class="rtl-pill" id="rtl-toggle" title="Toggle LTR/RTL">
                <span class="pill-label">LTR</span>
                <span class="pill-circle">L</span>
            </button>
        </div>
        <div class="login-box">
            <div class="login-card-logo">
                <a href="index.html"><i class="fas fa-car"></i> <span>DriveFree</span></a>
            </div>
            <h1>Welcome back</h1>
            <p class="login-subtitle">Sign in to your DriveFree account</p>

            <!-- Role Tabs -->
            <div class="role-tabs">
                <button class="role-tab active" id="tab-user" onclick="switchRole('user')">
                    <i class="fas fa-user"></i> User
                </button>
                <button class="role-tab" id="tab-admin" onclick="switchRole('admin')">
                    <i class="fas fa-shield-alt"></i> Admin
                </button>
            </div>

            <!-- Error message -->
            <div class="login-error" id="login-error">
                <i class="fas fa-exclamation-circle"></i>
                <span id="error-text">Invalid email or password.</span>
            </div>

            <!-- Form -->
            <form class="login-form" id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <div class="input-wrap">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="login-email" placeholder="you@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-pw" onclick="togglePw()" id="pw-toggle">
                            <i class="fas fa-eye" id="pw-icon"></i>
                        </button>
                    </div>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div class="login-divider">or continue with</div>

            <div class="social-login">
                <button class="btn-social"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48" style="flex-shrink:0"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg> Google</button>
                <button class="btn-social"><i class="fab fa-facebook-f"></i> Facebook</button>
            </div>

            <p class="signup-link">
                Don't have an account? <a href="register.html">Create one free</a>
            </p>
        </div>
    </div>

</div>

<script>
    let currentRole = 'user';

    function switchRole(role) {
        currentRole = role;
        document.getElementById('tab-user').classList.toggle('active', role === 'user');
        document.getElementById('tab-admin').classList.toggle('active', role === 'admin');
        document.getElementById('login-error').classList.remove('show');
        document.getElementById('login-form').reset();
    }

    function togglePw() {
        const input = document.getElementById('login-password');
        const icon  = document.getElementById('pw-icon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    function handleLogin(e) {
        e.preventDefault();
        const email    = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const errorEl  = document.getElementById('login-error');
        const errorTxt = document.getElementById('error-text');

        // Demo credentials
        const creds = {
            user:  { email: 'user@drivefree.in',  password: 'user123',  redirect: 'user-dashboard.html' },
            admin: { email: 'admin@drivefree.in', password: 'admin123', redirect: 'admin-dashboard.html' }
        };

        const target = creds[currentRole];
        if (email === target.email && password === target.password) {
            errorEl.classList.remove('show');
            window.location.href = target.redirect;
        } else {
            errorTxt.textContent = currentRole === 'admin'
                ? 'Invalid admin credentials.'
                : 'Invalid email or password.';
            errorEl.classList.add('show');
        }
    }

    // Theme sync with rest of site
    if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
    }

    // Theme toggle
    const themeToggle = document.getElementById('theme-toggle');
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.body.setAttribute('data-theme', savedTheme);
    if (themeToggle) {
        const icon = themeToggle.querySelector('i');
        if (icon) icon.className = savedTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        themeToggle.addEventListener('click', () => {
            const cur = document.body.getAttribute('data-theme');
            const next = cur === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            const ic = themeToggle.querySelector('i');
            if (ic) ic.className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        });
    }

    // RTL toggle
    const rtlToggle = document.getElementById('rtl-toggle');
    const savedDir = localStorage.getItem('dir') || 'ltr';
    document.body.setAttribute('dir', savedDir);
    function updateRtlPill(dir) {
        if (!rtlToggle) return;
        rtlToggle.querySelector('.pill-label').textContent = dir === 'rtl' ? 'RTL' : 'LTR';
        rtlToggle.querySelector('.pill-circle').textContent = dir === 'rtl' ? 'R' : 'L';
    }
    updateRtlPill(savedDir);
    if (rtlToggle) {
        rtlToggle.addEventListener('click', () => {
            const cur = document.body.getAttribute('dir');
            const next = cur === 'rtl' ? 'ltr' : 'rtl';
            document.body.setAttribute('dir', next);
            localStorage.setItem('dir', next);
            updateRtlPill(next);
        });
    }
</script>
</body>
</html>
