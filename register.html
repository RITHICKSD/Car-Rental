<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | DriveFree</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%232565eb' width='100' height='100' rx='20'/><path fill='white' d='M20 55 L25 45 L35 45 L40 55 L20 55 M60 55 L65 45 L75 45 L80 55 L60 55 M30 55 L70 55 L70 65 L30 65 L30 55 M25 65 L75 65 L75 70 L25 70 L25 65 M35 40 L65 40 L65 45 L35 45 L35 40'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .reg-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color, #f8fafc);
            padding: 2rem;
        }

        .reg-right {
            background: transparent;
            padding: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reg-box {
            background: var(--surface-color, #ffffff);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color, #e2e8f0);
            max-width: 460px;
            width: 100%;
        }

        .reg-card-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color, #3b82f6);
            margin-bottom: 1.5rem;
        }
        .reg-card-logo i {
            color: var(--primary-color, #3b82f6);
        }

        /* Controls (theme + RTL) */
        .reg-controls {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            z-index: 10;
        }
        .btn-icon {
            background: var(--bg-color, #f1f5f9);
            border: 1.5px solid var(--border-color, #e2e8f0);
            font-size: 1rem;
            color: var(--text-color, #0f172a);
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
        }
        .btn-icon:hover { color: #3b82f6; border-color: #3b82f6; }

        /* RTL Pill (matches global style.css) */
        .rtl-pill {
            display: inline-flex;
            align-items: center;
            background: var(--bg-color, #f1f5f9);
            border: 1.5px solid var(--border-color, #e2e8f0);
            border-radius: 999px;
            padding: 3px 3px 3px 10px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-color, #0f172a);
            white-space: nowrap;
            user-select: none;
            height: 34px;
            transition: all 0.25s;
        }
        .rtl-pill:hover { border-color: #3b82f6; color: #3b82f6; }
        .rtl-pill .pill-label { min-width: 22px; text-align: center; }
        .rtl-pill .pill-circle {
            width: 26px; height: 26px;
            border-radius: 50%;
            background: #3b82f6;
            color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: 800;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .reg-box h1 { font-size: 1.9rem; font-weight: 800; color: var(--text-color, #0f172a); margin-bottom: 0.4rem; text-align: center; white-space: nowrap; }
        .reg-subtitle { color: var(--text-muted, #64748b); font-size: 0.95rem; margin-bottom: 2rem; text-align: center; white-space: nowrap; }
        .reg-form { display: flex; flex-direction: column; gap: 1rem; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--text-color, #0f172a); }
        .input-wrap { position: relative; }
        .input-wrap i.field-icon {
            position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
            color: var(--text-muted, #94a3b8); font-size: 0.9rem;
        }
        .input-wrap input, .input-wrap select {
            width: 100%; padding: 0.8rem 1rem 0.8rem 2.7rem;
            border: 1.5px solid var(--border-color, #e2e8f0); border-radius: 8px;
            background: var(--surface-color, #fff); color: var(--text-color, #0f172a);
            font-size: 0.95rem; font-family: inherit; outline: none; transition: border-color 0.25s, box-shadow 0.25s;
        }
        .input-wrap input:focus, .input-wrap select:focus {
            border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        .toggle-pw {
            position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer;
            color: var(--text-muted, #94a3b8); font-size: 0.9rem; padding: 0;
        }
        .strength-bar { display: flex; gap: 4px; margin-top: 6px; }
        .strength-seg {
            flex: 1; height: 4px; border-radius: 2px;
            background: var(--border-color, #e2e8f0); transition: background 0.3s;
        }
        .strength-label { font-size: 0.75rem; color: var(--text-muted, #94a3b8); margin-top: 3px; }
        .terms-check { display: flex; align-items: flex-start; gap: 0.6rem; font-size: 0.85rem; color: var(--text-muted, #64748b); }
        .terms-check input { margin-top: 3px; accent-color: #3b82f6; cursor: pointer; flex-shrink: 0; }
        .terms-check a { color: #3b82f6; font-weight: 600; text-decoration: none; }
        .terms-check a:hover { text-decoration: underline; }
        .btn-register {
            width: 100%; padding: 0.85rem;
            background: #3b82f6; color: white; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 700; cursor: pointer; font-family: inherit;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            transition: background 0.25s, transform 0.2s, box-shadow 0.25s;
        }
        .btn-register:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,130,246,0.4); }
        .reg-divider {
            display: flex; align-items: center; gap: 0.75rem;
            color: var(--text-muted, #94a3b8); font-size: 0.82rem;
        }
        .reg-divider::before, .reg-divider::after { content: ''; flex: 1; height: 1px; background: var(--border-color, #e2e8f0); }
        .social-reg { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .btn-social {
            padding: 0.7rem; border: 1.5px solid var(--border-color, #e2e8f0);
            border-radius: 8px; background: var(--surface-color, #fff);
            color: var(--text-color, #0f172a); font-size: 0.88rem; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            gap: 0.5rem; transition: all 0.25s; font-family: inherit;
        }
        .btn-social:hover { border-color: #3b82f6; box-shadow: 0 2px 8px rgba(59,130,246,0.12); }
        .btn-social .fa-facebook-f { color: #1877f2; }
        .login-link { text-align: center; font-size: 0.88rem; color: var(--text-muted, #64748b); margin-top: 0.5rem; }
        .login-link a { color: #3b82f6; font-weight: 600; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
        .reg-error {
            display: none; background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.3); color: #ef4444;
            padding: 0.7rem 1rem; border-radius: 8px; font-size: 0.88rem;
            align-items: center; gap: 0.5rem;
        }
        .reg-error.show { display: flex; }
        .reg-success {
            display: none; background: rgba(16,185,129,0.08);
            border: 1px solid rgba(16,185,129,0.3); color: #10b981;
            padding: 0.7rem 1rem; border-radius: 8px; font-size: 0.88rem;
            align-items: center; gap: 0.5rem;
        }
        .reg-success.show { display: flex; }

        /* Responsive */
        @media (max-width: 768px) {
            .reg-page { padding: 1.5rem; }
            .reg-box { padding: 2rem; }
            .form-row { grid-template-columns: 1fr; }
            .reg-box h1 { font-size: 1.6rem; }
            .reg-subtitle { font-size: 0.9rem; }
            .reg-form { gap: 0.9rem; }
            .form-group label { font-size: 0.8rem; }
            .input-wrap input, .input-wrap select { padding: 0.75rem 1rem 0.75rem 2.5rem; font-size: 0.9rem; }
            .btn-register { padding: 0.75rem; font-size: 0.95rem; }
            .social-reg { gap: 0.6rem; }
            .btn-social { padding: 0.65rem; font-size: 0.85rem; }
        }

        @media (max-width: 480px) {
            .reg-page { padding: 1rem; }
            .reg-box { padding: 1.5rem; }
            .reg-box h1 { font-size: 1.4rem; }
            .reg-subtitle { font-size: 0.85rem; }
            .reg-form { gap: 0.85rem; }
            .form-group label { font-size: 0.75rem; }
            .input-wrap input, .input-wrap select { padding: 0.7rem 1rem 0.7rem 2.4rem; font-size: 0.85rem; }
            .terms-check { font-size: 0.8rem; }
            .btn-register { padding: 0.7rem; font-size: 0.9rem; }
            .login-link { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="reg-page">
    <!-- REGISTER CARD -->
    <div class="reg-right">
        <div class="reg-controls">
            <button class="btn-icon" id="theme-toggle" title="Toggle Dark/Light Mode"><i class="fas fa-moon"></i></button>
            <button class="rtl-pill" id="rtl-toggle" title="Toggle LTR/RTL">
                <span class="pill-label">LTR</span>
                <span class="pill-circle">L</span>
            </button>
        </div>
        <div class="reg-box">
            <div class="reg-card-logo">
                <a href="index.html"><i class="fas fa-car"></i> <span>DriveFree</span></a>
            </div>
            <h1>Create Account</h1>
            <p class="reg-subtitle">Sign up for free and start driving today</p>

            <div class="reg-error" id="reg-error"><i class="fas fa-exclamation-circle"></i><span id="error-text">Please fill all required fields.</span></div>
            <div class="reg-success" id="reg-success"><i class="fas fa-check-circle"></i><span>Account created! Redirecting to login…</span></div>

            <form class="reg-form" id="reg-form" onsubmit="handleRegister(event)" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">First Name</label>
                        <div class="input-wrap">
                            <i class="fas fa-user field-icon"></i>
                            <input type="text" id="first-name" placeholder="John" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="last-name">Last Name</label>
                        <div class="input-wrap">
                            <i class="fas fa-user field-icon"></i>
                            <input type="text" id="last-name" placeholder="Doe" required>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <div class="input-wrap">
                        <i class="fas fa-envelope field-icon"></i>
                        <input type="email" id="reg-email" placeholder="you@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-phone">Phone Number</label>
                    <div class="input-wrap">
                        <i class="fas fa-phone field-icon"></i>
                        <input type="tel" id="reg-phone" placeholder="+91 98765 43210" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-city">City</label>
                    <div class="input-wrap">
                        <i class="fas fa-map-marker-alt field-icon"></i>
                        <select id="reg-city" required>
                            <option value="">Select your city</option>
                            <option>Mumbai</option>
                            <option>Pune</option>
                            <option>Nashik</option>
                            <option>Aurangabad</option>
                            <option>Nagpur</option>
                            <option>Kolhapur</option>
                            <option>Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock field-icon"></i>
                        <input type="password" id="reg-password" placeholder="Create a strong password" required>
                        <button type="button" class="toggle-pw" onclick="togglePw('reg-password','pw-icon1')">
                            <i class="fas fa-eye" id="pw-icon1"></i>
                        </button>
                    </div>
                    <div class="strength-bar">
                        <div class="strength-seg" id="seg1"></div>
                        <div class="strength-seg" id="seg2"></div>
                        <div class="strength-seg" id="seg3"></div>
                        <div class="strength-seg" id="seg4"></div>
                    </div>
                    <span class="strength-label" id="strength-label">Enter a password</span>
                </div>
                <div class="form-group">
                    <label for="reg-confirm">Confirm Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock field-icon"></i>
                        <input type="password" id="reg-confirm" placeholder="Repeat your password" required>
                        <button type="button" class="toggle-pw" onclick="togglePw('reg-confirm','pw-icon2')">
                            <i class="fas fa-eye" id="pw-icon2"></i>
                        </button>
                    </div>
                </div>
                <label class="terms-check">
                    <input type="checkbox" id="terms-agree" required>
                    I agree to the <a href="#">Terms &amp; Conditions</a> and <a href="#">Privacy Policy</a>
                </label>
                <button type="submit" class="btn-register">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <div class="reg-divider" style="margin-top:1rem">or sign up with</div>
            <div class="social-reg" style="margin-top:0.75rem">
                <button class="btn-social"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48" style="flex-shrink:0"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg> Google</button>
                <button class="btn-social"><i class="fab fa-facebook-f"></i> Facebook</button>
            </div>
            <p class="login-link" style="margin-top:1.25rem">
                Already have an account? <a href="login.html">Sign in</a>
            </p>
        </div>
    </div>
</div>

<script>
    // Theme
    const themeToggle = document.getElementById('theme-toggle');
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.body.setAttribute('data-theme', savedTheme);
    if (themeToggle) {
        const icon = themeToggle.querySelector('i');
        if (icon) icon.className = savedTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        themeToggle.addEventListener('click', () => {
            const cur = document.body.getAttribute('data-theme');
            const next = cur === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            const ic = themeToggle.querySelector('i');
            if (ic) ic.className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        });
    }

    // RTL
    const rtlToggle = document.getElementById('rtl-toggle');
    const savedDir = localStorage.getItem('dir') || 'ltr';
    document.body.setAttribute('dir', savedDir);
    function updateRtlPill(dir) {
        if (!rtlToggle) return;
        rtlToggle.querySelector('.pill-label').textContent = dir === 'rtl' ? 'RTL' : 'LTR';
        rtlToggle.querySelector('.pill-circle').textContent = dir === 'rtl' ? 'R' : 'L';
    }
    updateRtlPill(savedDir);
    if (rtlToggle) {
        rtlToggle.addEventListener('click', () => {
            const cur = document.body.getAttribute('dir');
            const next = cur === 'rtl' ? 'ltr' : 'rtl';
            document.body.setAttribute('dir', next);
            localStorage.setItem('dir', next);
            updateRtlPill(next);
        });
    }

    // Password toggle
    function togglePw(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon  = document.getElementById(iconId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    // Password strength
    const pwInput = document.getElementById('reg-password');
    const segs    = [document.getElementById('seg1'), document.getElementById('seg2'),
                     document.getElementById('seg3'), document.getElementById('seg4')];
    const label   = document.getElementById('strength-label');
    const colors  = ['#ef4444','#f59e0b','#3b82f6','#10b981'];
    const labels  = ['Weak','Fair','Good','Strong'];

    pwInput.addEventListener('input', () => {
        const v = pwInput.value;
        let score = 0;
        if (v.length >= 8)              score++;
        if (/[A-Z]/.test(v))            score++;
        if (/[0-9]/.test(v))            score++;
        if (/[^A-Za-z0-9]/.test(v))     score++;
        segs.forEach((s, i) => {
            s.style.background = i < score ? colors[score - 1] : '';
        });
        label.textContent = v.length === 0 ? 'Enter a password' : labels[score - 1] || 'Weak';
        label.style.color = v.length === 0 ? '' : colors[score - 1];
    });

    // Form submit
    function handleRegister(e) {
        e.preventDefault();
        const err = document.getElementById('reg-error');
        const errTxt = document.getElementById('error-text');
        const ok  = document.getElementById('reg-success');

        const first    = document.getElementById('first-name').value.trim();
        const last     = document.getElementById('last-name').value.trim();
        const email    = document.getElementById('reg-email').value.trim();
        const phone    = document.getElementById('reg-phone').value.trim();
        const city     = document.getElementById('reg-city').value;
        const password = document.getElementById('reg-password').value;
        const confirm  = document.getElementById('reg-confirm').value;
        const agreed   = document.getElementById('terms-agree').checked;

        err.classList.remove('show');

        if (!first || !last || !email || !phone || !city || !password || !confirm) {
            errTxt.textContent = 'Please fill in all required fields.';
            return err.classList.add('show');
        }
        if (!/^\S+@\S+\.\S+$/.test(email)) {
            errTxt.textContent = 'Please enter a valid email address.';
            return err.classList.add('show');
        }
        if (password.length < 6) {
            errTxt.textContent = 'Password must be at least 6 characters.';
            return err.classList.add('show');
        }
        if (password !== confirm) {
            errTxt.textContent = 'Passwords do not match.';
            return err.classList.add('show');
        }
        if (!agreed) {
            errTxt.textContent = 'You must agree to the Terms & Conditions.';
            return err.classList.add('show');
        }

        ok.classList.add('show');
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
    }
</script>
</body>
</html>
